services:
  - type: web
    name: tdg-game-server
    runtime: node
    rootDir: tdg-game-server
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TDG_JOIN_SECRET
        sync: false
      - key: TDG_WEBHOOK_SECRET
        sync: false
      - key: VERCEL_MATCH_WEBHOOK_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_VERSION
        value: "20"
